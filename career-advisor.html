<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Student Career & Skill Advisor</title>
<style>
:root{--bg:#0f1226;--card:#1a1e3b;--card2:#232850;--text:#eef0ff;--muted:#9aa0c7;--accent:#7c5cff;--accent2:#22d3ee;--ok:#34d399;--bad:#f87171;--r:16px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#2a2170 0%,transparent 60%),var(--bg);color:var(--text);min-height:100vh}
button{font:inherit;cursor:pointer;border:0}
input,select{font:inherit;width:100%;padding:12px 14px;border-radius:12px;border:1px solid #343a70;background:var(--card2);color:var(--text);outline:none}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 6px}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 0 16px}
.logo{font-weight:800;font-size:1.1rem}
.logo span{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{background:linear-gradient(135deg,var(--accent),#5b8cff);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600}
.btn.ghost{background:transparent;border:1px solid #3a4080;color:var(--text)}
.btn.small{padding:8px 14px;font-size:.85rem}
.card{background:var(--card);border-radius:var(--r);padding:20px;margin-bottom:16px;border:1px solid #2b3163}
h1{font-size:1.8rem;line-height:1.2}h2{font-size:1.2rem;margin-bottom:10px}h3{font-size:1.05rem}
.muted{color:var(--muted)}
.hero{text-align:center;padding:30px 10px}
.hero p{margin:12px auto 20px;max-width:520px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.tab{background:var(--card);color:var(--muted);padding:10px 16px;border-radius:999px;white-space:nowrap;border:1px solid #2b3163}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 14px;border-radius:999px;background:var(--card2);border:1px solid #343a70;color:var(--text);font-size:.9rem}
.chip.on{background:var(--accent);border-color:var(--accent)}
.chip.good{background:#12372f;border-color:#1f6b57;color:var(--ok)}
.chip.miss{background:#3a1f2a;border-color:#7a2f45;color:var(--bad)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
.rec{display:flex;gap:14px}.rec .ic{font-size:2rem}
.bar{height:8px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.score{font-weight:800;color:var(--accent2)}
.step{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed #2b3163;margin:0;color:inherit;font-size:1rem}
.step input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.step.done span{text-decoration:line-through;color:var(--muted)}
details summary{cursor:pointer;color:var(--accent2);margin-top:10px;font-weight:600}
.chat{height:50vh;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:6px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;line-height:1.45;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--accent)}
.msg.assistant{align-self:flex-start;background:var(--card2)}
.chatbar{display:flex;gap:8px;margin-top:10px}
.err{color:var(--bad);font-size:.9rem;margin-top:10px;min-height:1em}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#06231a;padding:10px 18px;border-radius:12px;font-weight:600;display:none;z-index:9}
.hidden{display:none}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🎯 <span>Career Advisor</span></div>
    <div id="userbox" class="hidden"><span id="uname" class="muted"></span> <button class="btn ghost small" id="logout">Logout</button></div>
  </header>

  <section id="auth">
    <div class="hero">
      <h1>Find the career that fits <span style="color:var(--accent2)">you</span></h1>
      <p class="muted">Tell us your skills and interests. Get AI-powered career matches, skill-gap analysis, learning roadmaps and an advisor you can chat with.</p>
    </div>
    <div class="card" style="max-width:420px;margin:0 auto">
      <div class="tabs"><button class="tab active" id="t-login">Login</button><button class="tab" id="t-reg">Sign up</button></div>
      <div id="f-name" class="hidden"><label>Full name</label><input id="a-name" placeholder="Your name"></div>
      <label>Email</label><input id="a-email" type="email" placeholder="you@example.com">
      <label>Password</label><input id="a-pass" type="password" placeholder="At least 6 characters">
      <div class="err" id="a-err"></div>
      <button class="btn" style="width:100%;margin-top:8px" id="a-go">Login</button>
    </div>
  </section>

  <main id="app" class="hidden">
    <div class="tabs" id="tabs">
      <button class="tab active" data-p="p-profile">👤 Profile</button>
      <button class="tab" data-p="p-recs">✨ Matches</button>
      <button class="tab" data-p="p-road">🗺️ Roadmap</button>
      <button class="tab" data-p="p-chat">💬 Ask Advisor</button>
      <button class="tab" data-p="p-hist">🕘 History</button>
    </div>

    <div id="p-profile" class="panel">
      <div class="card">
        <h2>Your profile</h2>
        <div class="row">
          <div><label>Education level</label><select id="p-edu"></select></div>
          <div><label>Field / subject</label><input id="p-field" placeholder="e.g. Computer Science"></div>
        </div>
        <label>Career goal (optional)</label><input id="p-goal" placeholder="e.g. I want to become a web developer">
        <label>Skills you have</label><div class="chips" id="p-skills"></div>
        <label>Your interests</label><div class="chips" id="p-ints"></div>
        <div style="margin-top:20px"><button class="btn" id="p-save">Save &amp; Get Recommendations →</button></div>
        <div class="err" id="p-err"></div>
      </div>
    </div>

    <div id="p-recs" class="panel hidden"><div id="recs"></div></div>
    <div id="p-road" class="panel hidden"><div id="road"></div></div>

    <div id="p-chat" class="panel hidden">
      <div class="card">
        <h2>Ask your AI Advisor</h2>
        <div class="quick" id="quick"></div>
        <div class="chat" id="chat"></div>
        <div class="chatbar"><input id="c-in" placeholder="Ask about careers, skills, courses…"><button class="btn" id="c-go">Send</button></div>
      </div>
    </div>

    <div id="p-hist" class="panel hidden"><div class="card"><h2>Past recommendations</h2><div id="hist" class="muted">Nothing yet.</div></div></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= DATA ================= */
const SKILLS = ["Python","JavaScript","HTML/CSS","SQL","Excel","Statistics","Machine Learning","Data Visualization","Git","React","Mobile Development","Linux","Networking","Cybersecurity Basics","Cloud Basics","UI/UX Design","Communication","Writing","Marketing Basics","Project Management","Leadership","Problem Solving","Research","Teaching","Accounting Basics","Creativity"];
const INTERESTS = ["Technology","Programming","Data","Design","Business","Teaching","Writing","Security","Science","Management","Finance","Social Media","Mobile Apps","Cloud"];
const EDUCATION = ["Matric / O-Level","Intermediate / A-Level","Bachelor's (in progress)","Bachelor's (completed)","Master's","Self-taught"];

const CAREERS = [
 {id:"web-dev",title:"Web Developer",icon:"🌐",desc:"Build websites and web apps used by businesses and people every day.",
  skills:["HTML/CSS","JavaScript","Git","React","Problem Solving","SQL"],interests:["Technology","Programming","Design"],
  roadmap:["Learn HTML & CSS and build 3 static pages","Learn JavaScript fundamentals (DOM, fetch, ES6)","Learn Git & GitHub; publish your projects","Learn a framework such as React","Learn a backend + SQL database; build a full-stack app","Deploy a portfolio and apply for internships / freelance gigs"],
  resources:["freeCodeCamp","MDN Web Docs","The Odin Project","CS50 Web (edX)"]},
 {id:"data-analyst",title:"Data Analyst",icon:"📊",desc:"Turn raw data into insights and dashboards that guide decisions.",
  skills:["Excel","SQL","Statistics","Data Visualization","Communication","Python"],interests:["Data","Business","Science"],
  roadmap:["Master Excel (formulas, pivot tables, charts)","Learn SQL queries and joins","Learn basic statistics and probability","Learn Python with pandas for data cleaning","Build dashboards (Power BI / Tableau / Looker Studio)","Complete 3 portfolio projects with real datasets (Kaggle)"],
  resources:["Kaggle Learn","Google Data Analytics Certificate","Mode SQL Tutorial"]},
 {id:"ai-engineer",title:"AI / Machine Learning Engineer",icon:"🤖",desc:"Design models and AI-powered products that learn from data.",
  skills:["Python","Machine Learning","Statistics","SQL","Git","Problem Solving","Research"],interests:["Technology","Programming","Data","Science"],
  roadmap:["Get strong in Python and NumPy / pandas","Learn math basics: linear algebra, probability, statistics","Study classical ML with scikit-learn","Learn deep learning (PyTorch or TensorFlow)","Build and deploy an ML app (API + simple UI)","Join hackathons and publish projects / papers"],
  resources:["fast.ai","Andrew Ng's ML Specialization","Kaggle Competitions","Hugging Face Course"]},
 {id:"mobile-dev",title:"Mobile App Developer",icon:"📱",desc:"Create Android and iOS apps that people install and use daily.",
  skills:["Mobile Development","JavaScript","Git","UI/UX Design","Problem Solving"],interests:["Mobile Apps","Programming","Technology","Design"],
  roadmap:["Learn a language (Kotlin, Dart or JavaScript)","Pick a framework: Flutter or React Native","Build a to-do app with local storage","Connect your app to an online API / database","Publish an app on Google Play"],
  resources:["Flutter Docs","Android Developers Training","React Native Docs"]},
 {id:"ux-designer",title:"UI/UX Designer",icon:"🎨",desc:"Design products that are beautiful, simple and enjoyable to use.",
  skills:["UI/UX Design","Creativity","Communication","Research","HTML/CSS"],interests:["Design","Technology","Social Media"],
  roadmap:["Learn design principles: color, typography, layout","Learn Figma and build clickable prototypes","Learn user research and usability testing","Redesign 3 real apps as case studies","Publish a portfolio on Behance or a personal site"],
  resources:["Figma Learn","Google UX Design Certificate","Laws of UX"]},
 {id:"cyber",title:"Cybersecurity Analyst",icon:"🛡️",desc:"Protect systems, networks and data from attacks.",
  skills:["Cybersecurity Basics","Networking","Linux","Python","Problem Solving"],interests:["Security","Technology","Science"],
  roadmap:["Learn networking fundamentals (TCP/IP, DNS, HTTP)","Get comfortable with Linux command line","Learn security basics: encryption, authentication, OWASP Top 10","Practice legally on TryHackMe / Hack The Box","Prepare for CompTIA Security+ or similar certification"],
  resources:["TryHackMe","Cisco Networking Academy","OWASP"]},
 {id:"devops",title:"Cloud / DevOps Engineer",icon:"☁️",desc:"Deploy, scale and keep applications running reliably in the cloud.",
  skills:["Cloud Basics","Linux","Networking","Git","Python","Problem Solving"],interests:["Cloud","Technology","Programming"],
  roadmap:["Learn Linux and shell scripting","Learn Git and CI/CD basics","Learn Docker containers","Learn a cloud platform (AWS / Azure / GCP) free tier","Deploy a full app with automated pipeline"],
  resources:["AWS Skill Builder","Docker Docs","roadmap.sh/devops"]},
 {id:"marketer",title:"Digital Marketer",icon:"📣",desc:"Grow brands online using social media, content, SEO and ads.",
  skills:["Marketing Basics","Communication","Writing","Creativity","Data Visualization"],interests:["Social Media","Business","Writing","Design"],
  roadmap:["Learn marketing fundamentals and customer personas","Learn SEO and content marketing","Learn social media ads (Meta, Google Ads)","Learn analytics (Google Analytics)","Run a real campaign for a small business or your own page"],
  resources:["Google Digital Garage","HubSpot Academy","Meta Blueprint"]},
 {id:"teacher-tech",title:"Teacher / EdTech Specialist",icon:"🎓",desc:"Educate others and use technology to improve learning.",
  skills:["Teaching","Communication","Leadership","Creativity","Writing"],interests:["Teaching","Technology","Management"],
  roadmap:["Strengthen your subject knowledge","Learn lesson planning and classroom management","Learn digital tools (Google Classroom, Canva, Kahoot)","Complete teacher training / certification","Create online lessons and build a teaching profile"],
  resources:["Coursera: Learning How to Learn","Google for Education Training","Khan Academy"]},
 {id:"pm",title:"Project / Product Manager",icon:"🧭",desc:"Lead teams to deliver products and projects on time.",
  skills:["Project Management","Leadership","Communication","Problem Solving","Excel"],interests:["Management","Business","Technology"],
  roadmap:["Learn Agile and Scrum basics","Learn tools: Trello, Jira, Notion","Practice writing requirements and user stories","Lead a small team project or club","Earn CAPM / PSM certification"],
  resources:["Atlassian Agile Coach","Google Project Management Certificate","Scrum Guide"]},
 {id:"writer",title:"Content Writer / Journalist",icon:"✍️",desc:"Write articles, blogs, scripts and stories that inform and inspire.",
  skills:["Writing","Research","Creativity","Communication","Marketing Basics"],interests:["Writing","Social Media","Science"],
  roadmap:["Write daily and start a blog","Learn SEO writing and editing","Learn research and fact-checking","Build a portfolio of 10 published pieces","Pitch to magazines, agencies or freelance platforms"],
  resources:["Medium","Hemingway Editor","Coursera: Writing courses"]},
 {id:"accountant",title:"Accountant / Finance Analyst",icon:"💼",desc:"Manage money, budgets, audits and financial reports.",
  skills:["Accounting Basics","Excel","Statistics","Communication","Problem Solving"],interests:["Finance","Business","Data"],
  roadmap:["Learn accounting fundamentals (ledger, balance sheet)","Master Excel for finance","Learn accounting software (QuickBooks, Tally)","Study taxation basics","Start professional certification (ACCA / CA / CMA)"],
  resources:["ACCA Learning","Khan Academy Finance","Corporate Finance Institute"]}
];

/* ================= DATABASE (localStorage) ================= */
const DB = {
  get(k, d) { try { const v = localStorage.getItem('cadv_' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('cadv_' + k, JSON.stringify(v)); } catch (e) { toast('Storage error'); } },
  users() { return this.get('users', {}); },
  user(email) { return this.get('user_' + email, null); }, // per-user record
  save(email, u) { this.set('user_' + email, u); }
};
let mem = {}; // fallback hash helper
async function hashPw(pw, salt) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + pw));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; const s = salt + pw;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'x' + h;
  }
}

/* ================= ENGINE ================= */
function recommend(p) {
  const us = new Set(p.skills), ui = new Set(p.interests), goal = (p.goal || '').toLowerCase();
  return CAREERS.map(c => {
    const matched = c.skills.filter(s => us.has(s));
    const missing = c.skills.filter(s => !us.has(s));
    const hits = c.interests.filter(i => ui.has(i));
    const words = c.title.toLowerCase().replace(/\//g, ' ').split(' ').filter(w => w.length > 3);
    const bonus = goal && words.some(w => goal.includes(w)) ? 0.1 : 0;
    const score = Math.round(Math.min(1, 0.6 * matched.length / c.skills.length + 0.4 * Math.min(1, hits.length / 2) + bonus) * 100);
    return {id: c.id, title: c.title, icon: c.icon, desc: c.desc, score, matched, missing, roadmap: c.roadmap, resources: c.resources};
  }).sort((a, b) => b.score - a.score).slice(0, 6);
}
function advisorAnswer(q, recs) {
  q = q.toLowerCase();
  if (!recs.length) return "Please complete your profile and tap 'Save & Get Recommendations' first, then I can advise you.";
  const t = recs[0], has = (...k) => k.some(x => q.includes(x));
  if (has('learn', 'skill', 'gap', 'improve', 'missing')) return `For ${t.title}, your next skills to learn are: ${t.missing.slice(0, 4).join(', ') || 'you already cover the core skills!'}. Good free places to start: ${t.resources.slice(0, 3).join(', ')}.`;
  if (has('roadmap', 'plan', 'steps', 'start', 'how')) return `Roadmap to become a ${t.title}:\n` + t.roadmap.slice(0, 5).map((s, i) => `${i + 1}. ${s}`).join('\n');
  if (has('best', 'career', 'suit', 'job', 'which')) return 'Your best matches are: ' + recs.slice(0, 3).map(r => `${r.title} (${r.score}%)`).join(', ') + '.';
  if (has('resource', 'course', 'where', 'free')) return `Recommended resources for ${t.title}: ${t.resources.join(', ')}.`;
  if (has('salary', 'pay', 'money')) return `Pay depends on your skills, portfolio and location. For ${t.title}, build 3 real projects and start with internships or freelancing to grow your income quickly.`;
  return `Your top match is ${t.title} (${t.score}%). Ask me about skills to learn, a roadmap, free courses or other careers.`;
}

/* ================= UI HELPERS ================= */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t) { const e = $('#toast'); e.textContent = t; e.style.display = 'block'; setTimeout(() => e.style.display = 'none', 2000); }

let me = null, rec = null, mode = 'login';
const saveMe = () => DB.save(me.email, me);

/* ================= AUTH ================= */
function setMode(m) {
  mode = m;
  $('#t-login').classList.toggle('active', m === 'login'); $('#t-reg').classList.toggle('active', m === 'reg');
  $('#f-name').classList.toggle('hidden', m === 'login');
  $('#a-go').textContent = m === 'login' ? 'Login' : 'Create account'; $('#a-err').textContent = '';
}
$('#t-login').onclick = () => setMode('login'); $('#t-reg').onclick = () => setMode('reg');

$('#a-go').onclick = async () => {
  const email = $('#a-email').value.trim().toLowerCase(), pw = $('#a-pass').value, err = $('#a-err');
  err.textContent = '';
  if (!email.includes('@') || pw.length < 6) { err.textContent = 'Enter a valid email and a password of 6+ characters.'; return; }
  if (mode === 'reg') {
    const name = $('#a-name').value.trim();
    if (!name) { err.textContent = 'Please enter your name.'; return; }
    if (DB.user(email)) { err.textContent = 'This email is already registered.'; return; }
    const salt = Math.random().toString(36).slice(2);
    const u = {name, email, salt, hash: await hashPw(pw, salt), profile: {education: '', field: '', goal: '', skills: [], interests: []}, recs: [], history: [], progress: {}, chat: []};
    DB.save(email, u); me = u;
  } else {
    const u = DB.user(email);
    if (!u || u.hash !== await hashPw(pw, u.salt)) { err.textContent = 'Wrong email or password.'; return; }
    me = u;
  }
  DB.set('session', email); enterApp();
};
$('#logout').onclick = () => { DB.set('session', null); me = null; $('#app').classList.add('hidden'); $('#userbox').classList.add('hidden'); $('#auth').classList.remove('hidden'); $('#a-pass').value = ''; };

/* ================= APP ================= */
function enterApp() {
  $('#uname').textContent = me.name;
  $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden'); $('#userbox').classList.remove('hidden');
  buildProfile(); renderRecs(); renderRoad(); loadChat();
  show(me.recs.length ? 'p-recs' : 'p-profile');
}
function show(id) {
  $$('.panel').forEach(p => p.classList.toggle('hidden', p.id !== id));
  $$('#tabs .tab').forEach(t => t.classList.toggle('active', t.dataset.p === id));
  if (id === 'p-hist') loadHist();
}
$$('#tabs .tab').forEach(t => t.onclick = () => show(t.dataset.p));

function chips(el, list, selected) {
  el.innerHTML = '';
  list.forEach(x => {
    const b = document.createElement('button');
    b.className = 'chip' + (selected.includes(x) ? ' on' : ''); b.textContent = x;
    b.onclick = () => { const i = selected.indexOf(x); i > -1 ? selected.splice(i, 1) : selected.push(x); b.classList.toggle('on'); };
    el.appendChild(b);
  });
}
function buildProfile() {
  const p = me.profile;
  $('#p-edu').innerHTML = '<option value="">Select…</option>' + EDUCATION.map(e => `<option ${e === p.education ? 'selected' : ''}>${esc(e)}</option>`).join('');
  $('#p-field').value = p.field || ''; $('#p-goal').value = p.goal || '';
  chips($('#p-skills'), SKILLS, p.skills); chips($('#p-ints'), INTERESTS, p.interests);
}
$('#p-save').onclick = () => {
  const p = me.profile; $('#p-err').textContent = '';
  p.education = $('#p-edu').value; p.field = $('#p-field').value; p.goal = $('#p-goal').value;
  if (!p.skills.length && !p.interests.length) { $('#p-err').textContent = 'Select at least one skill or interest first.'; return; }
  me.recs = recommend(p);
  me.history.unshift({date: new Date().toLocaleString(), top: me.recs[0].title, score: me.recs[0].score});
  me.history = me.history.slice(0, 10);
  saveMe(); renderRecs(); renderRoad(); toast('Recommendations ready!'); show('p-recs');
};

function renderRecs() {
  const box = $('#recs'), recs = me.recs;
  if (!recs.length) { box.innerHTML = '<div class="card muted">Complete your profile to see career matches.</div>'; return; }
  box.innerHTML = recs.map((r, i) => `
    <div class="card">
      <div class="rec"><div class="ic">${r.icon}</div><div style="flex:1">
        <div style="display:flex;justify-content:space-between;gap:8px"><h3>${i === 0 ? '🏆 ' : ''}${esc(r.title)}</h3><span class="score">${r.score}%</span></div>
        <div class="bar"><i style="width:${r.score}%"></i></div>
        <p class="muted">${esc(r.desc)}</p>
      </div></div>
      <label>Skills you already have</label>
      <div class="chips">${r.matched.length ? r.matched.map(s => `<span class="chip good">✓ ${esc(s)}</span>`).join('') : '<span class="muted">None yet</span>'}</div>
      <label>Skills to learn</label>
      <div class="chips">${r.missing.length ? r.missing.map(s => `<span class="chip miss">+ ${esc(s)}</span>`).join('') : '<span class="muted">You cover them all!</span>'}</div>
      <details><summary>Free learning resources</summary><p class="muted" style="margin-top:8px">${r.resources.map(esc).join(' · ')}</p></details>
    </div>`).join('');
}

function renderRoad() {
  const box = $('#road');
  if (!me.recs.length) { box.innerHTML = '<div class="card muted">Get recommendations first to unlock roadmaps.</div>'; return; }
  box.innerHTML = me.recs.slice(0, 3).map(r => {
    const done = me.progress[r.id] || [], pct = Math.round(done.length / r.roadmap.length * 100);
    return `<div class="card"><h3>${r.icon} ${esc(r.title)} roadmap</h3>
      <div class="bar"><i style="width:${pct}%"></i></div><p class="muted" style="margin-bottom:6px">${pct}% complete</p>
      ${r.roadmap.map((s, i) => `<label class="step ${done.includes(i) ? 'done' : ''}"><input type="checkbox" data-c="${r.id}" data-i="${i}" ${done.includes(i) ? 'checked' : ''}><span>${esc(s)}</span></label>`).join('')}
    </div>`;
  }).join('');
  $$('#road input').forEach(cb => cb.onchange = () => {
    const c = cb.dataset.c, i = +cb.dataset.i, arr = me.progress[c] || [];
    me.progress[c] = cb.checked ? [...new Set([...arr, i])] : arr.filter(x => x !== i);
    saveMe(); renderRoad();
  });
}

/* ================= CHAT ================= */
const QUICK = ['Which career suits me best?', 'What skills should I learn?', 'Give me a roadmap', 'Suggest free courses'];
$('#quick').innerHTML = QUICK.map(q => `<button class="chip">${q}</button>`).join('');
$$('#quick .chip').forEach(b => b.onclick = () => sendChat(b.textContent));
function addMsg(role, text) {
  const d = document.createElement('div'); d.className = 'msg ' + role; d.textContent = text;
  $('#chat').appendChild(d); $('#chat').scrollTop = 1e9; return d;
}
function loadChat() {
  $('#chat').innerHTML = '';
  if (!me.chat.length) addMsg('assistant', "Hi! I'm your career advisor. Ask me anything about careers, skills or learning paths.");
  me.chat.forEach(m => addMsg(m.role, m.content));
}
function sendChat(text) {
  text = (text || $('#c-in').value).trim(); if (!text) return;
  $('#c-in').value = ''; addMsg('user', text);
  const ans = advisorAnswer(text, me.recs);
  me.chat.push({role: 'user', content: text}, {role: 'assistant', content: ans});
  me.chat = me.chat.slice(-100); saveMe();
  setTimeout(() => addMsg('assistant', ans), 300);
}
$('#c-go').onclick = () => sendChat();
$('#c-in').onkeydown = e => { if (e.key === 'Enter') sendChat(); };

function loadHist() {
  $('#hist').innerHTML = me.history.length ? me.history.map(x => `<div class="step"><span>${esc(x.date)} — <b>${esc(x.top)}</b> (${x.score}%)</span></div>`).join('') : 'Nothing yet.';
}

/* ================= BOOT ================= */
(function () {
  const s = DB.get('session', null), u = s && DB.user(s);
  if (u) { me = u; enterApp(); }
})();
</script>
